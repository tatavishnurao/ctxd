<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ctxd — context packet inspector</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root{
    --bg:#1b1b1d; --panel:#242427; --line:#3a3a3e; --txt:#e6e6e3; --muted:#9a9a93;
    --purple-bg:#2a2740; --purple-br:#7f77dd; --purple-tx:#cecbf6;
    --green-bg:#17302a; --green-br:#1d9e75; --green-tx:#9fe1cb;
    --coral-bg:#2e211c; --coral-br:#d85a30; --coral-tx:#f0997b;
    --blue-bg:#152330; --blue-br:#378add; --blue-tx:#b5d4f4;
    --amber-tx:#ef9f27;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.3px}
  .dot{width:9px;height:9px;border-radius:50%;background:#555}
  .dot.ok{background:#1d9e75}.dot.err{background:#d85a30}
  .controls{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:end}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  input,select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--purple-br)}
  button{background:var(--purple-br);border-color:var(--purple-br);color:#14121f;font-weight:600;cursor:pointer;padding:9px 18px}
  button:disabled{opacity:.5;cursor:default}
  .sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 20px 0;color:var(--muted);font-size:12px}
  .wrap{max-width:880px;margin:20px auto 70px;padding:0 20px}
  .node{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 16px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
  .node.show{opacity:1;transform:none}
  .node .t{font-weight:600}.node .k{color:var(--muted);font-size:12px;margin-top:3px}
  .node .metric{color:var(--blue-tx);font-size:11px;margin-top:6px}
  .formula{margin-top:8px;padding:10px 12px;background:#00000038;border:1px dashed var(--line);border-radius:6px;overflow-x:auto;color:var(--amber-tx)}
  .formula .katex{color:#f2d79a;font-size:1.02em}
  .ascii{font-size:12px;white-space:pre-wrap}
  .note{margin-top:8px;padding:9px 12px;border-radius:6px;border:1px dashed var(--coral-br);background:#2e211c;color:var(--coral-tx);font-size:12px}
  .purple{background:var(--purple-bg);border-color:var(--purple-br);color:var(--purple-tx)}
  .green{background:var(--green-bg);border-color:var(--green-br);color:var(--green-tx)}
  .arrow{height:24px;position:relative}
  .arrow::before{content:"";position:absolute;left:50%;top:0;bottom:7px;width:1.5px;background:var(--line);transform:translateX(-50%)}
  .arrow::after{content:"";position:absolute;left:50%;bottom:4px;width:7px;height:7px;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:translateX(-50%) rotate(45deg)}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
  th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:10px;letter-spacing:.5px}
  tr.kept td:first-child{box-shadow:inset 3px 0 0 var(--green-br)}
  tr.dropped{color:var(--muted)}
  tr.dropped td:first-child{box-shadow:inset 3px 0 0 var(--coral-br)}
  .tag{display:inline-block;padding:0 7px;border-radius:999px;font-size:10px;border:1px solid currentColor}
  .tag.k{color:var(--green-tx)}.tag.d{color:var(--coral-tx)}
  .bar{height:8px;border-radius:4px;background:#000;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
  .bar>span{display:block;height:100%;background:var(--green-br)}
  .err{color:var(--coral-tx);background:var(--coral-bg);border:1px solid var(--coral-br);border-radius:10px;padding:14px 16px;margin-top:10px}
  input[type=range]{accent-color:var(--purple-br)}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>ctxd · context packet inspector</h1>
  <span style="color:var(--muted);font-size:12px">metrics &amp; formulae at each step · POST /v1/query</span>
</header>

<div class="controls">
  <div><label>Query</label><input id="q" value="what does component 7 do under failure?" /></div>
  <div><label>Mode</label><select id="mode">
    <option value="lexical" selected>lexical</option>
    <option value="semantic">semantic</option>
    <option value="hybrid">hybrid</option>
  </select></div>
  <div><label>Tenant</label><input id="tenant" value="demo" style="width:90px" /></div>
  <div><button id="run">Run ▸</button></div>
</div>
<div class="sub">
  <label style="margin:0">Budget</label>
  <input id="budget" type="range" min="20" max="4000" step="20" value="1000" style="width:260px" />
  <span id="budgetval" style="color:var(--txt)">1000 tok</span>
  <span>·</span><span>API base</span>
  <input id="base" value="http://localhost:8000" style="padding:3px 8px;font-size:12px" />
  <span id="timing"></span>
</div>

<div class="wrap" id="stage"></div>

<script>
const $=id=>document.getElementById(id);
const el=(c,h)=>{const d=document.createElement("div");d.className=c;d.innerHTML=h;return d;};
const arrow=()=>el("arrow","");
const esc=s=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// LaTeX (rendered via KaTeX) + ASCII fallback
const TEX={
  lexical:"\\text{BM25}(q,d)=\\sum_{t\\in q}\\underbrace{\\ln\\!\\Big(1+\\tfrac{N-df_t+0.5}{df_t+0.5}\\Big)}_{\\text{IDF}(t)}\\cdot\\frac{tf_{t,d}\\,(k_1+1)}{tf_{t,d}+k_1\\big(1-b+b\\,\\tfrac{|d|}{\\overline{|d|}}\\big)}",
  semantic:"\\cos(q,d)=\\frac{q\\cdot d}{\\lVert q\\rVert\\,\\lVert d\\rVert}\\;\\xrightarrow{\\text{L2-norm}}\\;q\\cdot d\\quad(\\text{Model2Vec, }256\\text{-d})",
  hybrid:"\\text{RRF}(d)=\\!\\!\\sum_{b\\in\\{\\text{lex},\\text{sem}\\}}\\!\\!\\frac{1}{k+\\operatorname{rank}_b(d)},\\qquad k=60"
};
const ASCII={
  lexical:"BM25(q,d) = Σ_t ln(1+(N−df+0.5)/(df+0.5)) · tf·(k1+1)/(tf + k1(1−b+b·|d|/avg|d|))",
  semantic:"cos(q,d) = (q·d)/(|q||d|)  → (L2-normalised) q·d   · Model2Vec 256-d",
  hybrid:"RRF(d) = Σ_branch 1/(k + rank_branch(d))   · k = 60"
};
const SM={
  auth:"— (identity, not metered)",
  retrieve:"ctxd_retrieval_latency_seconds · ctxd_retrieval_candidates_returned · ctxd_lexical_search_latency_seconds",
  budget:"ctxd_context_tokens_selected · ctxd_context_candidates_dropped_total",
  packet:"ctxd_retrieval_mode_requests_total{mode,status} · ctxd_request_latency_seconds"
};

// Sample data (real component-7 run) so the pipeline renders immediately,
// even in a preview with no live backend. A successful Run replaces it.
const SAMPLE={
  metadata:{retrieval_type:"lexical", retrieved_candidate_count:9, candidate_tokens:2959},
  candidates:[
    {source_id:"chk_1",relevance_score:3.614,token_cost:355,metadata:{source_path:"handbook.md",start_line:27,end_line:51}},
    {source_id:"chk_2",relevance_score:0.220,token_cost:355,metadata:{source_path:"handbook.md",start_line:75,end_line:99}},
    {source_id:"chk_3",relevance_score:0.220,token_cost:355,metadata:{source_path:"handbook.md",start_line:51,end_line:75}},
    {source_id:"chk_4",relevance_score:0.220,token_cost:355,metadata:{source_path:"handbook.md",start_line:123,end_line:147}},
    {source_id:"chk_5",relevance_score:0.220,token_cost:355,metadata:{source_path:"handbook.md",start_line:147,end_line:171}},
    {source_id:"chk_6",relevance_score:0.220,token_cost:355,metadata:{source_path:"handbook.md",start_line:99,end_line:123}},
    {source_id:"chk_7",relevance_score:0.220,token_cost:355,metadata:{source_path:"handbook.md",start_line:171,end_line:195}},
    {source_id:"chk_8",relevance_score:0.220,token_cost:358,metadata:{source_path:"handbook.md",start_line:1,end_line:27}},
    {source_id:"chk_9",relevance_score:0.206,token_cost:116,metadata:{source_path:"handbook.md",start_line:195,end_line:201}}
  ]
};
let ALL=[], META={}, MODE="lexical", LIVE=false;

function renderFormula(elm, mode){
  if(window.katex){
    try{ katex.render(TEX[mode], elm, {displayMode:true, throwOnError:false}); return; }catch(e){}
  }
  elm.innerHTML='<div class="ascii">'+esc(ASCII[mode])+'</div>';
}

async function fetchRanking(){
  const base=$("base").value.replace(/\/$/,"");
  const q=$("q").value, tenant=$("tenant").value; MODE=$("mode").value;
  $("run").disabled=true; $("dot").className="dot"; $("timing").textContent="running…";
  const t0=performance.now();
  try{
    const r=await fetch(base+"/v1/query",{method:"POST",
      headers:{"content-type":"application/json","x-tenant-id":tenant},
      body:JSON.stringify({tenant_id:tenant,query:q,retrieval_mode:MODE,max_context_tokens:1000000,top_k:20})});
    if(!r.ok) throw new Error("HTTP "+r.status+" — "+(await r.text()).slice(0,300));
    const data=await r.json(); const c=data.context||{}; META=c.metadata||{}; ALL=c.candidates||[]; LIVE=true;
    $("dot").className="dot ok"; $("timing").textContent=Math.round(performance.now()-t0)+" ms · live ranking fetched";
  }catch(e){
    $("dot").className="dot err"; $("timing").textContent="";
    $("stage").innerHTML=""; $("stage").appendChild(el("err","<b>Request failed.</b> "+esc(e.message)+
      "<br><br>Connection/CORS error? The API needs CORS enabled and the stack must be up — see the shipped note."));
    $("run").disabled=false; return;
  }
  $("run").disabled=false; render();
}

function render(){
  const budget=parseInt($("budget").value,10);
  let used=0, keptN=0, dropN=0;
  const rows=ALL.map((c,i)=>{ const fits=used+c.token_cost<=budget; if(fits){used+=c.token_cost;keptN++;}else dropN++;
    return {...c, rank:i+1, kept:fits, running:used}; });
  const candTokens=ALL.reduce((s,c)=>s+c.token_cost,0);
  const execMode=META.retrieval_type||MODE;
  const branch=execMode==="semantic"?"Semantic · exact pgvector":execMode==="hybrid"?"Hybrid · BM25 + vectors · RRF":"BM25 lexical · SQL inverted index";
  const util=budget?Math.min(100,Math.round(used/budget*100)):0;

  const stage=$("stage"); stage.innerHTML="";
  const push=n=>{stage.appendChild(n);stage.appendChild(arrow());};

  push(el("node purple",`<div class="t">POST /v1/query</div>
    <div class="k">q: "${esc($("q").value)}" · tenant=${esc($("tenant").value)} · mode=${esc(MODE)}</div>`));
  push(el("node purple",`<div class="t">Auth (dev mode)</div>
    <div class="k">x-tenant-id → tenant "${esc($("tenant").value)}"</div>
    <div class="metric">metrics: ${SM.auth}</div>`));

  const retr=el("node purple",`<div class="t">Retrieve · ${esc(branch)}</div>
    <div class="k">retrieval_type: ${esc(execMode)} · query scored against the tenant index</div>
    <div class="formula" id="ftarget"></div>
    <div class="metric">metrics: ${SM.retrieve}</div>`);
  push(retr);

  const tbl=ALL.length?`<table><thead><tr><th>#</th><th>source</th><th>lines</th><th>score</th><th>tok</th><th>Σkept</th><th></th></tr></thead><tbody>${
    rows.map(r=>`<tr class="${r.kept?'kept':'dropped'}"><td>${r.rank}</td>
      <td>${esc(r.metadata?.source_path||r.source_id)}</td>
      <td>${r.metadata?.start_line??'?'}–${r.metadata?.end_line??'?'}</td>
      <td>${(r.relevance_score??0).toFixed(3)}</td><td>${r.token_cost}</td>
      <td>${r.kept?r.running:'—'}</td>
      <td><span class="tag ${r.kept?'k':'d'}">${r.kept?'KEPT':'DROP'}</span></td></tr>`).join("")}
    </tbody></table>`:`<div class="k">no candidates</div>`;
  const topDropped=rows.length && !rows[0].kept;
  const floor=topDropped?`<div class="note">⚠ relevance-floor limitation (live): the #1-ranked candidate (score ${(rows[0].relevance_score??0).toFixed(3)}, ${rows[0].token_cost} tok) did NOT fit the budget, so a lower-ranked, smaller chunk was kept instead. No relevance floor or "top-evidence-dropped" warning yet — a known gap, fixable without breaking the greedy/provenance invariants.</div>`:"";
  push(el("node purple",`<div class="t">Greedy budget fill · cap ${budget} tok</div>
    <div class="k">keep each candidate in rank order while Σ token_cost ≤ budget (first-fit, no truncation). Cut applied with the server's exact rule.</div>
    ${tbl}${floor}
    <div class="metric">metrics: ${SM.budget}</div>`));

  stage.appendChild(el("node green",`<div class="t">ContextPacket</div>
    <div class="k">retrieved ${ALL.length} · candidate_tokens ${candTokens} · selected ${keptN} · dropped_due_to_budget ${dropN}</div>
    <div class="k">context_tokens ${used} / ${budget} · utilisation ${util}% · retrieval_type ${esc(execMode)}${META.warnings?` · <span style="color:var(--coral-tx)">warnings ${esc(JSON.stringify(META.warnings))}</span>`:""}</div>
    <div class="bar"><span style="width:${util}%"></span></div>
    <div class="metric">metrics: ${SM.packet}</div>`));

  renderFormula(document.getElementById("ftarget"), MODE);
  [...stage.querySelectorAll(".node")].forEach((n,i)=>setTimeout(()=>n.classList.add("show"),60*i));
}

$("budget").addEventListener("input",()=>{ $("budgetval").textContent=$("budget").value+" tok"; if(ALL.length) render(); });
$("run").addEventListener("click",fetchRanking);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")fetchRanking();});
$("mode").addEventListener("change",()=>{ if(LIVE) fetchRanking(); else render(); });

// Render the pipeline immediately with sample data (offline-friendly).
window.addEventListener("load",()=>{
  ALL=SAMPLE.candidates; META=SAMPLE.metadata; MODE=$("mode").value;
  $("timing").textContent="showing sample data — Run against a live stack to replace";
  render();
});
</script>
</body>
</html>
