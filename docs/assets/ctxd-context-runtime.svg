<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ctxd" x1="383" y1="122" x2="814" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162033"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="packet" x1="889" y1="191" x2="1092" y2="411" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102B31"/>
      <stop offset="1" stop-color="#12202C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6EE7F9"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="618" rx="27" stroke="#243247" stroke-opacity="0.9"/>

  <text x="62" y="68" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">ctxd — context runtime</text>
  <text x="62" y="103" fill="#9FB0C7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Turn a large information space into the smallest trustworthy ContextPacket a task needs.</text>

  <!-- Left: information space -->
  <rect x="62" y="153" width="252" height="326" rx="22" fill="#111B2B" stroke="#2A3A52" filter="url(#shadow)"/>
  <text x="89" y="194" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Information space</text>
  <text x="89" y="218" fill="#7F91AA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">large · noisy · heterogeneous</text>

  <rect x="89" y="248" width="198" height="46" rx="12" fill="#172238" stroke="#30415D"/>
  <text x="111" y="276" fill="#DCE7F7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">docs / Markdown</text>
  <circle cx="267" cy="271" r="6" fill="#60A5FA"/>

  <rect x="89" y="307" width="198" height="46" rx="12" fill="#172238" stroke="#30415D"/>
  <text x="111" y="335" fill="#DCE7F7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">repositories / notes</text>
  <circle cx="267" cy="330" r="6" fill="#A78BFA"/>

  <rect x="89" y="366" width="198" height="46" rx="12" fill="#172238" stroke="#30415D"/>
  <text x="111" y="394" fill="#DCE7F7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">tenant knowledge</text>
  <circle cx="267" cy="389" r="6" fill="#F59E0B"/>

  <text x="89" y="449" fill="#7F91AA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">deterministic chunking</text>
  <text x="89" y="466" fill="#7F91AA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">+ persistent provenance</text>

  <!-- Arrow into ctxd -->
  <line x1="330" y1="316" x2="375" y2="316" stroke="#6EE7F9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="333" y="300" fill="#80DFF0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">query</text>

  <!-- Center: ctxd -->
  <rect x="390" y="133" width="430" height="366" rx="26" fill="url(#ctxd)" stroke="#3A4B67" filter="url(#shadow)"/>
  <text x="423" y="179" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="750">ctxd</text>
  <text x="482" y="179" fill="#6EE7F9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">decides the slice</text>

  <rect x="423" y="212" width="364" height="60" rx="14" fill="#17243A" stroke="#35506E"/>
  <circle cx="451" cy="242" r="13" fill="#123B52"/>
  <text x="446" y="247" fill="#6EE7F9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="478" y="238" fill="#F2F7FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Retrieve</text>
  <text x="478" y="257" fill="#93A4BA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">BM25 lexical + optional dense semantic</text>

  <rect x="423" y="284" width="364" height="60" rx="14" fill="#17243A" stroke="#35506E"/>
  <circle cx="451" cy="314" r="13" fill="#173548"/>
  <text x="446" y="319" fill="#6EE7F9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="478" y="310" fill="#F2F7FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Fuse</text>
  <text x="478" y="329" fill="#93A4BA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">parallel deterministic reciprocal-rank fusion</text>

  <rect x="423" y="356" width="364" height="60" rx="14" fill="#17243A" stroke="#35506E"/>
  <circle cx="451" cy="386" r="13" fill="#1B3A43"/>
  <text x="446" y="391" fill="#6EE7F9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="478" y="382" fill="#F2F7FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Select + budget</text>
  <text x="478" y="401" fill="#93A4BA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">whole chunks · token-bounded assembly</text>

  <rect x="423" y="428" width="364" height="42" rx="12" fill="#122235" stroke="#2D4059"/>
  <text x="442" y="454" fill="#A7B8CC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">provenance · deterministic metadata · bounded failure</text>

  <!-- Arrow to ContextPacket -->
  <line x1="835" y1="316" x2="880" y2="316" stroke="#6EE7F9" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Right: packet -->
  <rect x="894" y="169" width="244" height="286" rx="24" fill="url(#packet)" stroke="#2B5D67" filter="url(#shadow)"/>
  <text x="926" y="213" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">ContextPacket</text>
  <text x="926" y="239" fill="#76DDEB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">auditable output boundary</text>

  <rect x="926" y="267" width="180" height="34" rx="10" fill="#15313A"/>
  <text x="945" y="289" fill="#DDF9FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">selected evidence</text>

  <rect x="926" y="311" width="180" height="34" rx="10" fill="#15313A"/>
  <text x="945" y="333" fill="#DDF9FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">source provenance</text>

  <rect x="926" y="355" width="180" height="34" rx="10" fill="#15313A"/>
  <text x="945" y="377" fill="#DDF9FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">tokens + retrieval metadata</text>

  <text x="926" y="420" fill="#8EA8B0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">model / agent runtime</text>
  <text x="926" y="437" fill="#8EA8B0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">is deliberately out of scope</text>

  <!-- Footer -->
  <line x1="62" y1="541" x2="1138" y2="541" stroke="#243247"/>
  <text x="62" y="579" fill="#7F91AA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Goal:</text>
  <text x="101" y="579" fill="#D6E2F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">maximize useful evidence preserved</text>
  <text x="325" y="579" fill="#566A84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">while minimizing</text>
  <text x="435" y="579" fill="#D6E2F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">tokens · latency · redundancy</text>
  <text x="664" y="579" fill="#566A84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">subject to</text>
  <text x="736" y="579" fill="#D6E2F0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">provenance · budget · tenant boundaries</text>
</svg>
