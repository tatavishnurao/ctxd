# Brings up the evaluated path: PostgreSQL + exact pgvector + pinned Model2Vec,
# with hybrid as the server default retrieval mode. Credentials and published
# ports are for local development only; this is not a hardened deployment.
x-ctxd-env: &ctxd-env
  CTXD_STORAGE_BACKEND: postgres
  CTXD_DATABASE_URL: postgresql://ctxd:ctxd@postgres:5432/ctxd
  CTXD_EMBEDDING_PROVIDER: model2vec
  CTXD_EMBEDDING_CACHE_DIR: /models
  CTXD_OTEL_ENABLED: "false"

services:
  app:
    build: .
    environment: *ctxd-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model_cache:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *ctxd-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ctxd
      POSTGRES_PASSWORD: ctxd
      POSTGRES_DB: ctxd
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctxd -d ctxd"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  model_cache:
