name: ci

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    env:
      CTXD_DATABASE_URL: postgresql://ctxd:ctxd@localhost:5432/ctxd_test
      CTXD_TEST_DATABASE_URL: postgresql://ctxd:ctxd@localhost:5432/ctxd_test
      CTXD_RUN_MODEL2VEC: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxd
          POSTGRES_PASSWORD: ctxd
          POSTGRES_DB: ctxd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxd -d ctxd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --python 3.13 --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Migrate test database
        run: uv run alembic upgrade head
      - name: Migration round trip (down to base, back to head)
        run: uv run alembic downgrade base && uv run alembic upgrade head
      - name: Cache pinned Model2Vec artifact
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: model2vec-potion-base-8M-bf8b056651a2c21b8d2565580b8569da283cab23
      - name: Tests
        run: uv run pytest
